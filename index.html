
<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Noor Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quill Rich Text Editor CSS & JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <style>
        body {
            font-family: 'Lora', serif;
            margin: 0;
            padding: 0;
            background-color: #fcfdfa;
        }
        .font-serif-display { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-amiri { font-family: 'Amiri', serif; }
        
        .islamic-pattern {
            position: relative;
        }
        .islamic-pattern::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z' fill='%23daa520' fill-opacity='0.03'/%3E%3Ccircle cx='50' cy='50' r='10' fill='none' stroke='%23daa520' stroke-opacity='0.02' stroke-width='0.5'/%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Quill Professional Styling */
        .ql-toolbar.ql-snow {
            border: 1px solid #e5e7eb !important;
            border-radius: 1.5rem 1.5rem 0 0 !important;
            background: #f9fafb !important;
            padding: 12px !important;
        }
        .ql-container.ql-snow {
            border: 1px solid #e5e7eb !important;
            border-radius: 0 0 1.5rem 1.5rem !important;
            min-height: 300px !important;
            font-family: 'Lora', serif !important;
            font-size: 1.1rem !important;
            background: white !important;
        }
        .ql-editor {
            min-height: 300px !important;
            color: #064e3b !important;
        }

        /* Rendered Blog Content Styling (Prose) */
        .blog-prose h1 { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #064e3b; margin: 1.5rem 0; }
        .blog-prose h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #064e3b; margin: 1.25rem 0; }
        .blog-prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #374151; }
        .blog-prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .blog-prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .blog-prose strong { color: #064e3b; font-weight: 700; }
        .blog-prose u { text-decoration: underline; }
        .blog-prose em { font-style: italic; }
        .blog-prose .ql-align-center { text-align: center; }
        .blog-prose .ql-align-right { text-align: right; }
    </style>

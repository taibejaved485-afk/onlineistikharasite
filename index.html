
<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Noor Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Lora', serif;
            margin: 0;
            padding: 0;
            background-color: #fcfdfa;
        }
        .font-serif-display { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-amiri { font-family: 'Amiri', serif; }
        
        /* High-End Islamic Mandala Pattern Overlay */
        .islamic-pattern {
            position: relative;
        }
        .islamic-pattern::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z' fill='%23daa520' fill-opacity='0.03'/%3E%3Ccircle cx='50' cy='50' r='10' fill='none' stroke='%23daa520' stroke-opacity='0.02' stroke-width='0.5'/%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        .glass-dropdown {
            background: rgba(6, 78, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(218, 165, 32, 0.2);
        }

        /* Slide-down animation */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Fade-in up animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        /* Wobble animation */
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .group:hover .animate-wobble-hover {
            animation: wobble 0.4s ease-in-out infinite;
        }

        /* Gold Glow Effect */
        .gold-glow {
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
            transition: all 0.3s ease;
        }
        .gold-glow:hover {
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.6);
        }

        /* Custom Floral Border for Talisman Cards */
        .floral-border {
            border: 1px solid transparent;
            border-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0 L10 0 L10 10 L0 10 Z M90 0 L100 0 L100 10 L90 10 Z M0 90 L10 90 L10 100 L0 100 Z M90 90 L100 90 L100 100 L90 100 Z' fill='%23daa520'/%3E%3C/svg%3E") 10 stretch;
            padding: 2px;
        }
    </style>
<script type="importmap">

</head>
